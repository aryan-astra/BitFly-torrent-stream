name: Windows CI and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/source-checks.yml
  build:
    name: ${{ matrix.arch }} build and package
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            qt_host: windows
            qt_arch: win64_msvc2022_64
            qt_kit: msvc2022_64
            cmake_arch: x64
            vcpkg_triplet: x64-windows
          - arch: arm64
            runner: windows-11-arm
            qt_host: windows_arm64
            qt_arch: win64_msvc2022_arm64
            qt_kit: msvc2022_arm64
            cmake_arch: ARM64
            vcpkg_triplet: arm64-windows
    runs-on: ${{ matrix.runner }}
    env:
      VCPKG_DISABLE_METRICS: 1
      QT_COMMAND_LINE_PARSER_NO_GUI_MESSAGE_BOXES: 1
    steps:
      - name: Checkout BitFly
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify release version
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(BitFly VERSION ([0-9]+\.[0-9]+\.[0-9]+)') { throw 'Missing application version.' }
          $version = $Matches[1]
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -notmatch "^v$([regex]::Escape($version))(-[0-9A-Za-z.-]+)?$") {
            throw "Release tag $env:GITHUB_REF_NAME does not match application version $version."
          }
          "BITFLY_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout pinned vcpkg baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: microsoft/vcpkg
          ref: 84bab45d415d22042bd0b9081aea57f362da3f35
          path: .tools/vcpkg
          persist-credentials: false

      - name: Verify native runner architecture
        shell: pwsh
        run: |
          $expected = if ('${{ matrix.arch }}' -eq 'x64') { 'X64' } else { 'ARM64' }
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -ne $expected) {
            throw "Expected native $expected runner, got $([Runtime.InteropServices.RuntimeInformation]::OSArchitecture)."
          }

      - name: Prepare vcpkg binary archive cache
        id: vcpkg-archive
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ImageVersion)) { throw 'Hosted runner ImageVersion is unavailable; refusing an unstable cache key.' }
          $archivePath = Join-Path $env:LOCALAPPDATA 'vcpkg/archives'
          New-Item -ItemType Directory -Force -Path $archivePath | Out-Null
          "path=$archivePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$env:ImageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "VCPKG_DEFAULT_BINARY_CACHE=$archivePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore vcpkg binary archives
        id: vcpkg-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ steps.vcpkg-archive.outputs.path }}
          key: vcpkg-84bab45d415d22042bd0b9081aea57f362da3f35-${{ matrix.arch }}-${{ hashFiles('scripts/vcpkg-triplets/*.cmake') }}-${{ steps.vcpkg-archive.outputs.version }}

      - name: Install pinned Qt 6.8.3
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          if ('${{ matrix.arch }}' -eq 'x64') {
            python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir .tools/Qt
          } else {
            python -m aqt install-qt windows_arm64 desktop 6.8.3 win64_msvc2022_arm64 --autodesktop --outputdir .tools/Qt
          }
          if ($LASTEXITCODE -ne 0) { throw 'Qt installation failed.' }
          "QT_ROOT=$env:GITHUB_WORKSPACE/.tools/Qt/6.8.3/${{ matrix.qt_kit }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $expected = '84bab45d415d22042bd0b9081aea57f362da3f35'
          $actual = git -C .tools/vcpkg rev-parse HEAD
          if ($actual -ne $expected) { throw "Unexpected vcpkg checkout $actual" }
          & .tools/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed.' }

      - name: Install libtorrent 2.0.11 and dependencies
        shell: pwsh
        run: |
          & .tools/vcpkg/vcpkg.exe install "libtorrent:${{ matrix.vcpkg_triplet }}" --disable-metrics --overlay-triplets=scripts/vcpkg-triplets
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg dependency installation failed.' }

      - name: Save vcpkg binary archives
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ steps.vcpkg-archive.outputs.path }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Install signed Inno Setup 6.4.3
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.4.3.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_4_3/innosetup-6.4.3.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') {
            throw "Inno Setup installer signature was not valid for the expected publisher: $($signature.Status) $($signature.SignerCertificate.Subject)"
          }
          $installDir = Join-Path $env:GITHUB_WORKSPACE '.tools/InnoSetup'
          $install = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$installDir") -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Inno Setup installer failed with exit code $($install.ExitCode)" }
          $compiler = Join-Path $installDir 'ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'Signed Inno Setup installation did not provide ISCC.exe.' }
          $installDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure, build, test, and package
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (!(Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw "vswhere.exe not found: $vswhere" }
          $vsResult = & $vswhere -latest -products '*' -version '[17.0,19.0)' -format json
          if ($LASTEXITCODE -ne 0) { throw "vswhere failed with exit code $LASTEXITCODE." }
          $instances = @($vsResult | ConvertFrom-Json)
          $vsInstall = if ($instances.Count) { $instances[0].installationPath } else { '' }
          if ([string]::IsNullOrWhiteSpace($vsInstall) -or !(Test-Path -LiteralPath $vsInstall -PathType Container)) {
            throw 'Could not locate a supported Visual Studio 2022/2026 instance.'
          }
          $cmakeGenerator = if (([version]$instances[0].installationVersion).Major -eq 18) { 'Visual Studio 18 2026' } else { 'Visual Studio 17 2022' }
          $vcInstall = Join-Path $vsInstall 'VC'
          if (!(Test-Path -LiteralPath (Join-Path $vcInstall 'Tools/MSVC') -PathType Container)) {
            throw "MSVC toolsets were not found under $vcInstall."
          }
          $env:VCINSTALLDIR = "$vcInstall\"
          $env:VCToolsRedistDir = Join-Path $vcInstall 'Redist/MSVC'
          if (!(Test-Path -LiteralPath $env:VCToolsRedistDir -PathType Container)) {
            throw "MSVC redistributable tree was not found: $env:VCToolsRedistDir"
          }
          $targetArch = if ('${{ matrix.arch }}' -eq 'x64') { 'x64' } else { 'arm64' }
          $redistCandidates = @(Get-ChildItem -LiteralPath $env:VCToolsRedistDir -Directory |
            ForEach-Object { Join-Path $_.FullName "$targetArch/Microsoft.VC143.CRT" } |
            Where-Object { Test-Path -LiteralPath $_ -PathType Container } | Sort-Object -Descending)
          if ($redistCandidates.Count -eq 0) {
            throw "No Microsoft.VC143.CRT redistributable found for $targetArch under $env:VCToolsRedistDir."
          }
          $msvcRedistDir = $redistCandidates[0]
          "VCINSTALLDIR=$env:VCINSTALLDIR" | Write-Host
          "Selected MSVC redist: $msvcRedistDir" | Write-Host
          $build = Join-Path $env:GITHUB_WORKSPACE 'build/release'
          $stage = Join-Path $build 'stage'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $triplet = '${{ matrix.vcpkg_triplet }}'
          $toolchain = Join-Path $env:GITHUB_WORKSPACE '.tools/vcpkg/scripts/buildsystems/vcpkg.cmake'
          $overlayTriplets = Join-Path $env:GITHUB_WORKSPACE 'scripts/vcpkg-triplets'
          cmake -S . -B $build -G $cmakeGenerator -A '${{ matrix.cmake_arch }}' -T v143 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT" `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET="$triplet" `
            -DVCPKG_OVERLAY_TRIPLETS="$overlayTriplets" `
            -DVCPKG_INSTALLED_DIR="$env:GITHUB_WORKSPACE/.tools/vcpkg/installed" `
            -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed.' }
          cmake --build $build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
          $env:PATH = "$env:QT_ROOT\bin;$env:GITHUB_WORKSPACE\.tools\vcpkg\installed\$triplet\bin;$env:PATH"
          ctest --test-dir $build --build-config Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'QtTest suite failed.' }
          cmake --install $build --config Release --prefix $stage
          if ($LASTEXITCODE -ne 0) { throw 'Install staging failed.' }
          & scripts/package.ps1 -Architecture '${{ matrix.arch }}' -StagePath $stage -QtRoot $env:QT_ROOT `
            -VcpkgRoot (Join-Path $env:GITHUB_WORKSPACE '.tools/vcpkg') -MsvcRedistDir $msvcRedistDir `
            -OutputDir $dist -RequireInstaller
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed.' }

      - name: Verify and smoke-test portable package
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $base = "BitFly-$env:BITFLY_VERSION-windows-${{ matrix.arch }}"
          $manifest = @(Get-Content -LiteralPath (Join-Path $dist "$base-SHA256SUMS.txt"))
          if ($manifest.Count -ne 2) { throw 'Expected installer and ZIP checksums.' }
          foreach ($name in @("$base.zip", "$base-setup.exe")) {
            $expected = @($manifest | Where-Object { $_ -match "^[A-Fa-f0-9]{64}  $([regex]::Escape($name))$" })
            if ($expected.Count -ne 1) { throw "Missing or duplicate checksum for $name." }
            if ((Get-FileHash -LiteralPath (Join-Path $dist $name) -Algorithm SHA256).Hash -ne $expected[0].Substring(0, 64)) { throw "Checksum mismatch for $name." }
          }
          $portable = Join-Path $env:RUNNER_TEMP 'bitfly-portable'
          Expand-Archive -LiteralPath (Join-Path $dist "$base.zip") -DestinationPath $portable
          $exe = Join-Path $portable 'BitFly.exe'
          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw "Portable executable not found: $exe" }
          $data = Join-Path $env:RUNNER_TEMP 'bitfly-smoke-data'
          New-Item -ItemType Directory -Path $data | Out-Null
          $env:PATH = "$portable;$env:WINDIR/System32;$env:WINDIR"
          $env:QT_PLUGIN_PATH = $portable
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = Join-Path $portable 'platforms'
          $env:QT_QPA_PLATFORM = 'windows'
          Remove-Item Env:QML_IMPORT_PATH, Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          $stdout = Join-Path $env:RUNNER_TEMP 'bitfly-smoke-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'bitfly-smoke-stderr.txt'
          $process = Start-Process -FilePath $exe -ArgumentList @('--diagnostic-data-dir', $data, '--quit-after', '1500') -WindowStyle Hidden -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (!$process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'Portable native application did not exit within 30 seconds.'
          }
          if ($process.ExitCode -ne 0) { throw "Portable native boot failed: $(Get-Content -LiteralPath $stderr -Raw)" }
          # A hosted runner may have no exposed desktop; render separately with the matching SDK validation plugin.
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = Join-Path $env:QT_ROOT 'plugins/platforms'
          $env:QT_QPA_FONTDIR = Join-Path $env:WINDIR 'Fonts'
          $screenshot = Join-Path $env:RUNNER_TEMP 'bitfly-portable.png'
          $process = Start-Process -FilePath $exe -ArgumentList @('--diagnostic-data-dir', $data, '--screenshot', $screenshot) -WindowStyle Hidden -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (!$process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'Portable offscreen render did not exit within 30 seconds.'
          }
          if ($process.ExitCode -ne 0 -or !(Test-Path -LiteralPath $screenshot -PathType Leaf) -or (Get-Item -LiteralPath $screenshot).Length -lt 1024) {
            throw "Portable render failed: $(Get-Content -LiteralPath $stderr -Raw)"
          }
          'Verified both checksums; extracted portable native boot and offscreen render passed using packaged DLLs.'

      - name: Upload architecture artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BitFly-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish verified Windows assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, quality]
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download x64 and ARM64 outputs from this successful run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name BitFly-x64 --dir release/x64
          if ($LASTEXITCODE -ne 0) { throw 'Could not download x64 artifacts.' }
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name BitFly-arm64 --dir release/arm64
          if ($LASTEXITCODE -ne 0) { throw 'Could not download ARM64 artifacts.' }
          $assets = @(Get-ChildItem release -Recurse -File)
          if ($assets.Count -ne 6) { throw 'Both architectures must provide exactly a ZIP, installer, and SHA-256 file.' }
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(BitFly VERSION ([0-9]+\.[0-9]+\.[0-9]+)') { throw 'Missing application version.' }
          $version = $Matches[1]
          foreach ($arch in @('x64', 'arm64')) {
            $base = "BitFly-$version-windows-$arch"
            $directory = Join-Path release $arch
            $manifest = @(Get-Content -LiteralPath (Join-Path $directory "$base-SHA256SUMS.txt"))
            if ($manifest.Count -ne 2) { throw "Expected installer and ZIP checksums for $arch." }
            foreach ($name in @("$base.zip", "$base-setup.exe")) {
              $expected = @($manifest | Where-Object { $_ -match "^[A-Fa-f0-9]{64}  $([regex]::Escape($name))$" })
              if ($expected.Count -ne 1) { throw "Missing or duplicate checksum for $name." }
              if ((Get-FileHash -LiteralPath (Join-Path $directory $name) -Algorithm SHA256).Hash -ne $expected[0].Substring(0, 64)) { throw "Checksum mismatch for $name." }
            }
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem release -Recurse -File | ForEach-Object FullName)
          $releaseArgs = @('release', 'create', $env:GITHUB_REF_NAME) + $assets + @('--repo', $env:GITHUB_REPOSITORY, '--verify-tag', '--generate-notes')
          if ($env:GITHUB_REF_NAME.Contains('-')) { $releaseArgs += '--prerelease' }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed.' }
